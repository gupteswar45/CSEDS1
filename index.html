<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Largest Number Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Find the Largest Number</h2>
        <p>Enter 5 numbers below:</p>
        
        <input type="number" class="num-input" placeholder="Number 1">
        <input type="number" class="num-input" placeholder="Number 2">
        <input type="number" class="num-input" placeholder="Number 3">
        <input type="number" class="num-input" placeholder="Number 4">
        <input type="number" class="num-input" placeholder="Number 5">

        <button onclick="findLargest()">Find Result</button>

        <div id="result">Your result will appear here</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
